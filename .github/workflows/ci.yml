name: Build and test

on: [push]

permissions:
  contents: read

jobs:
  api:
    name: Build and test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install --global pnpm@11.8.0

      - name: Build and test API
        working-directory: api
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install --global pnpm@11.8.0

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  worker:
    name: Build and test Go worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum

      - name: Build and test Go worker
        working-directory: worker
        run: |
          go build ./...
          go test -race ./...
          go vet ./...

  notify:
    name: Notify Slack
    needs: [api, frontend, worker]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Send results to Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: |
              Build and test finished for ${{ github.repository }} (${{ github.ref_name }})
              API: ${{ needs.api.result }}
              Frontend: ${{ needs.frontend.result }}
              Go worker: ${{ needs.worker.result }}
              <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View pipeline>
