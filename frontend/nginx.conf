server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Resolve the Compose service at request time so static pages can load
        # while the API is starting or unavailable.
        resolver 127.0.0.11 valid=30s;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Vite fingerprints these assets, so they can be cached permanently.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Revalidate the entry point so new deployments load fresh asset URLs.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
